site_name: Free Cloud Initiative Documentation
site_description: Official documentation for the Free Cloud Initiative platform and infrastructure.
site_author: Free Cloud Initiative Team
site_url: https://freecloudinitiative.github.io/free-cloud-initiative-docs/
repo_url: https://github.com/freecloudinitiative/free-cloud-initiative-docs
repo_name: freecloudinitiative/free-cloud-initiative-docs

theme:
  name: material
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Architecture Overview: architecture.md
  - Infrastructure (Terraform): terraform.md
  - Cluster Setup (Ansible & K3s): ansible-k3s.md
  - Continuous Delivery (GitOps): gitops-manifests.md
  - Getting Started: getting-started.md
