# yaml-language-server: $schema=https://squidfunk.github.io/mkdocs-material/schema.json
site_name: Free Cloud Initiative
site_description: >-
  Architecture and operator documentation for the Free Cloud Initiative — a
  self-hosted cloud control plane running on K3s.
site_author: Free Cloud Initiative
site_url: https://freecloudinitiative.github.io/docs/

repo_url: https://github.com/freecloudinitiative
repo_name: freecloudinitiative

edit_uri: ""

theme:
  name: material
  language: en
  logo: assets/logo.png
  favicon: assets/favicon.png
  font:
    text: JetBrains Mono
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.indexes
    - navigation.instant
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.tooltips

extra_css:
  - assets/custom.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/freecloudinitiative
      name: Free Cloud Initiative on GitHub
  generator: false

plugins:
  - search:
      lang: en

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.keys
  - attr_list
  - md_in_html
  - footnotes
  - tables
  - toc:
      permalink: true
      title: On this page

nav:
  - "[ HOME ]": index.md
  - "[ ARCHITECTURE ]":
    - "System overview": architecture.md
    - "Control plane": platform-services.md
    - "Repository catalog": repositories.md
  - "[ BUILD PATH ]":
    - learning-path.md
    - "01 / Terraform": terraform.md
    - "02 / Ansible & K3s": ansible-k3s.md
    - "03 / GitOps & Argo CD": gitops-manifests.md
  - "[ CONTRIBUTE ]": getting-started.md
