# yaml-language-server: $schema=https://squidfunk.github.io/mkdocs-material/schema.json
site_name: Free Cloud Initiative
site_description: >-
  Architecture and operator documentation for the Free Cloud Initiative — a
  self-hosted cloud control plane running on K3s.
site_author: Free Cloud Initiative
site_url: https://freecloudinitiative.github.io/docs/

repo_url: https://github.com/freecloudinitiative
repo_name: freecloudinitiative

edit_uri: ""

theme:
  name: material
  language: en
  logo: assets/logo.png
  favicon: assets/logo.png
  font: false
  palette:
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to light sketch mode
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.indexes
    - navigation.instant
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.tooltips

extra_css:
  - assets/custom.css

extra:
  generator: false

plugins:
  - search:
      lang: en

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.keys
  - attr_list
  - md_in_html
  - footnotes
  - tables
  - toc:
      permalink: true
      title: On this page

nav:
  - "[ HOME ]": index.md
  - "[ ARCHITECTURE ]":
    - "System overview": architecture.md
    - "Control plane": platform-services.md
    - "Repository catalog": repositories.md
  - "[ LEARNING ]":
    - "Learning map": learning-path.md
    - "Foundations":
      - "01 / Terraform": terraform.md
      - "02 / Ansible": ansible-k3s.md
      - "03 / Docker & OCI": learning/docker.md
      - "04 / Kubernetes & K3s": learning/kubernetes.md
      - "05 / GitOps & Argo CD": gitops-manifests.md
    - "Platform operations":
      - "Networking & edge": learning/networking.md
      - "Identity, secrets & policy": learning/security.md
      - "Data & storage": learning/data-storage.md
      - "Observability": learning/observability.md
      - "CI/CD & supply chain": learning/ci-cd.md
    - "Application platform":
      - "Go control-plane patterns": learning/control-plane.md
      - "React operator console": learning/frontend.md
  - "[ CONTRIBUTE ]": getting-started.md
